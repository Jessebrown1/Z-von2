<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZÉVON — Fearless Streetwear</title>
  <meta name="description" content="ZÉVON. Crafted for the fearless. A limited edition premium streetwear collection." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('zevon_theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
    // TEMP DIAGNOSTIC — remove after mobile blank-screen bug is fixed.
    (function () {
      function show(label, detail) {
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#fff;color:#900;' +
          'font:12px/1.4 monospace;padding:16px;overflow:auto;white-space:pre-wrap;';
        box.textContent = label + '\n' + detail;
        document.body.appendChild(box);
      }
      window.addEventListener('error', function (e) {
        show('JS ERROR: ' + e.message, (e.filename || '') + ':' + e.lineno + ':' + e.colno + '\n' + (e.error && e.error.stack || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('UNHANDLED REJECTION', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
      });
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
